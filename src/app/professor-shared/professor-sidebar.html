@if (layout.mobileOpen()) {
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Close navigation"
    (click)="layout.closeMobileSidebar()"
  ></button>
}
<aside
  class="sidebar"
  [class.collapsed]="layout.collapsed()"
  [class.mobile-open]="layout.mobileOpen()"
>
  <a
    class="brand"
    routerLink="/professor-dashboard"
    [replaceUrl]="true"
    (click)="layout.closeMobileSidebar()"
  >
    <span class="brand-mark"
      ><svg viewBox="0 0 24 24">
        <path d="m2.5 9.25 9.5-5.1 9.5 5.1-9.5 5.1-9.5-5.1Z" />
        <path d="M6.5 11.4v4.25c0 1.35 2.45 2.45 5.5 2.45s5.5-1.1 5.5-2.45V11.4" />
        <path d="M21.5 9.4v5.1" /></svg
    ></span>
    <b>Digital Grades<small>Professor Portal</small></b>
  </a>
  <p class="nav-label">Navigation</p>
  <nav (click)="layout.closeMobileSidebar()">
    <a
      routerLink="/professor-dashboard"
      [replaceUrl]="true"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ><svg class="nav-icon" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1" />
        <rect x="14" y="3.5" width="6.5" height="6.5" rx="1" />
        <rect x="3.5" y="14" width="6.5" height="6.5" rx="1" />
        <rect x="14" y="14" width="6.5" height="6.5" rx="1" /></svg
      ><span>Dashboard</span></a
    >
    <a routerLink="/professor-classes" [replaceUrl]="true" routerLinkActive="active"
      ><svg class="nav-icon" viewBox="0 0 24 24">
        <path
          d="M4 5.25A2.25 2.25 0 0 1 6.25 3h11.5A2.25 2.25 0 0 1 20 5.25v13.5a2.25 2.25 0 0 1-2.25 2.25H6.25A2.25 2.25 0 0 1 4 18.75V5.25Z"
        />
        <path d="M8 7.5h8M8 11.5h8M8 15.5h4.5" /></svg
      ><span>My Classes</span></a
    >
    <a routerLink="/professor-students" [replaceUrl]="true" routerLinkActive="active"
      ><svg class="nav-icon" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3.1" />
        <path
          d="M3.75 19.5c.55-3.25 2.32-5 5.25-5s4.7 1.75 5.25 5M16.5 5.25a3.1 3.1 0 0 1 0 5.95M16.5 14.5c2.2 0 3.65 1.1 4.3 3.4"
        /></svg
      ><span>My Students</span></a
    >
    <a routerLink="/professor-grade-forms" [replaceUrl]="true" routerLinkActive="active"
      ><svg class="nav-icon" viewBox="0 0 24 24">
        <path
          d="M8 3.5h7l4 4v12.25A1.25 1.25 0 0 1 17.75 21h-10.5A1.25 1.25 0 0 1 6 19.75v-15A1.25 1.25 0 0 1 7.25 3.5H8Z"
        />
        <path d="M14.75 3.75V8h4M9 12h6M9 15.5h6" /></svg
      ><span>Grade Forms</span></a
    >
  </nav>
  <button class="logout" type="button" (click)="signOut()">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path
        d="M10.5 4H6.75A1.75 1.75 0 0 0 5 5.75v12.5C5 19.22 5.78 20 6.75 20h3.75M14 8l4 4-4 4M18 12H9"
      /></svg
    ><span>Logout</span>
  </button>
</aside>
